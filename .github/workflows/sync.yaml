name: Upstream Sync

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into sync branch
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/tangly1024/NotionNext.git
          git fetch origin main
          git fetch upstream main

          git checkout -B upstream-sync origin/main
          git merge -X theirs --no-edit upstream/main

          # 保留你仓库中的个性化配置，避免被上游覆盖
          git checkout origin/main -- blog.config.js conf/ || true

          if git diff --quiet origin/main..HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No upstream updates to sync."
            exit 0
          fi

          git push --force-with-lease origin upstream-sync
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create or update sync PR
        if: steps.merge.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const head = `${owner}:upstream-sync`
            const base = 'main'
            const title = 'chore: sync upstream updates'
            const body = [
              '自动同步上游仓库最新变更到 `upstream-sync` 分支。',
              '',
              '- 该 PR 不会直接改动受保护的 `main` 分支',
              '- 已优先保留本仓库配置文件（`blog.config.js` 与 `conf/`）',
              '- 合并前请在 PR 中确认站点配置和页面行为'
            ].join('\n')

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base
            })

            if (prs.data.length > 0) {
              core.info(`PR already exists: #${prs.data[0].number}`)
              return
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              head: 'upstream-sync',
              base,
              title,
              body
            })
            core.info(`Created PR #${pr.data.number}`)
